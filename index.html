    <script>
      try {
        const saved = localStorage.getItem('copilot_decoy') || 'settings';
        if (saved === 'settings') {
          document.title = 'Settings';
        } else if (saved === 'notepad') {
          document.title = 'Notepad - Notes.txt';
        } else if (saved === 'system') {
          document.title = 'System Diagnostics & Performance';
        } else if (saved === 'calc') {
          document.title = 'Calculator';
        }
      } catch (e) {}
    </script>

        window.addEventListener('load', () => {
